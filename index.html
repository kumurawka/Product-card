<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>макет карточки продукта</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>
  <div class="container">
    <h1 class="title">Выбери свой продукт</h1>
    <button id="change-color-all-cards">сменить цвет всех карточек</button>
    <button id="change-color-first-card">сменить цвет первой карточки</button>
    <button id="open-google">Открыть страницу Google</button>
    <button id="output-console-log">Вывести сообщение в консоль лог</button>

    <ul class="product-list"></ul>
    <template id="product-card-template">
      <li class="card">
        <img class="card__image" src="" alt="Товар">
        <div class="card__rating-box">
          <div class="card__stars-list"></div>
          <span class="card__rating"></span>
        </div>
        <p class="card__target-skin"></p>
        <h2 class="card__title"></h2>
        <p class="card__description"></p>
        <span class="card__composition-title"></span>
        <ul class="card__composition-list"></ul>
        <div class="card__price-box">
          <b class="card__price-label">Цена:</b>
          <span class="card__price-value"></span>
        </div>
        <button class="card__buy"></button>
      </li>
    </template>
  </div>
  <script src="homework-10.js" type="module"></script>
</body>
</html>
